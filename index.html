<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 앱 본문과 같은 Pretendard를 웹에서도 쓴다. 동적 서브셋이라 한글 글리프를
         통째로 받지 않고 쓰인 조각만 내려받는다(공식 권장 방식). -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />

    <!-- 일본어 화면에만 쓰는 글꼴. 원판 Pretendard에는 한자가 한 자도 없어(0/20992), 일본어
         문장을 가나와 한자 두 글꼴이 나눠 그리게 된다. Noto Sans JP는 unicode-range로 잘게
         쪼개져 있어서, 페이지에 실제로 나온 글자 조각만 내려받는다. 언어 전환이 클라이언트에서
         일어나므로 한국어·영어 화면의 DOM에는 일본어가 없고, 그래서 일본어를 고른 사람만
         실제 폰트 파일을 받는다. 적용 규칙은 style.css의 html[lang="ja"]에 있다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap"
    />

    <!-- Search Console 소유권 확인. 파일(public/google9821a0e3e94a21a5.html)로도 같이
         올려 두었다 - 확인 방법을 어느 쪽으로 고르든 통과하도록. -->
    <meta name="google-site-verification" content="MozeKofV5a9BWaIehIGll6Y1JL1t3CxX3-bZEumWvm8" />

    <title>TabStick — Index notes for windows</title>
    <meta name="description" content="Stick a note beside the window it belongs to, not on your desktop. A light Windows note utility organized by nine colors." />

    <!-- 공유 카드. X로 들어오는 사람이 가장 많은데(2026-07-27) 그동안 카드 없이 맨 링크로만
         떴다. 절대 주소가 필요해서 자체 도메인을 붙이고 나서야 넣을 수 있었다.
         주소는 www로 적는다 - apex(tabstick.com)는 308로 여기 넘어오므로, 사람이 실제로
         닿는 곳이자 최종 목적지가 www다. 사람에게 보여 주는 표시값만 짧은 apex를 쓴다. -->
    <link rel="canonical" href="https://www.tabstick.com/" />

    <!-- 같은 페이지의 세 언어(2026-08-27). 빌드 뒤 scripts/localize.mjs가 이 HTML을 바탕으로
         /ko/·/ja/의 HTML을 만들며 lang·제목·설명·og·canonical만 갈아 끼운다 - 아래 넷은 세 벌에
         똑같이 들어가야 하므로 여기 정적으로 둔다. 영어가 `/`이자 x-default다(그동안 `/` 하나에
         쌓인 검색 신호를 흩지 않으려는 것). -->
    <link rel="alternate" hreflang="en" href="https://www.tabstick.com/" />
    <link rel="alternate" hreflang="ko" href="https://www.tabstick.com/ko/" />
    <link rel="alternate" hreflang="ja" href="https://www.tabstick.com/ja/" />
    <link rel="alternate" hreflang="x-default" href="https://www.tabstick.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TabStick" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://www.tabstick.com/" />
    <meta property="og:title" content="TabStick — Index notes for windows" />
    <meta property="og:description" content="Stick a note beside the window it belongs to, not on your desktop. A light Windows note utility organized by nine colors." />
    <meta property="og:image" content="https://www.tabstick.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TabStick notes in different colors open across several windows" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
